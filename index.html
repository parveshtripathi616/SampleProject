<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Image Slider</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="slider-container">
        <div class="slider">
            <div class="slide active" data-bg="https://images.unsplash.com/photo-1506905925346-21bda4d32df4?ixlib=rb-4.0.3&auto=format&fit=crop&w=1200&q=80">
                <img src="https://images.unsplash.com/photo-1506905925346-21bda4d32df4?ixlib=rb-4.0.3&auto=format&fit=crop&w=1200&q=80" alt="Beautiful mountain landscape" class="slide-image">
                <div class="slide-content">
                    <h2>Mountain Landscape</h2>
                    <p>Beautiful landscape with mountains and lakes</p>
                </div>
            </div>
            <div class="slide" data-bg="https://images.unsplash.com/photo-1449824913935-59a10b8d2000?ixlib=rb-4.0.3&auto=format&fit=crop&w=1200&q=80">
                <img src="https://images.unsplash.com/photo-1449824913935-59a10b8d2000?ixlib=rb-4.0.3&auto=format&fit=crop&w=1200&q=80" alt="Modern city skyline" class="slide-image">
                <div class="slide-content">
                    <h2>City Skyline</h2>
                    <p>Urban cityscape with modern architecture</p>
                </div>
            </div>
            <div class="slide" data-bg="https://images.unsplash.com/photo-1507525428034-b723cf961d3e?ixlib=rb-4.0.3&auto=format&fit=crop&w=1200&q=80">
                <img src="https://images.unsplash.com/photo-1507525428034-b723cf961d3e?ixlib=rb-4.0.3&auto=format&fit=crop&w=1200&q=80" alt="Tropical beach paradise" class="slide-image">
                <div class="slide-content">
                    <h2>Tropical Beach</h2>
                    <p>Peaceful beach with crystal clear water</p>
                </div>
            </div>
            <div class="slide" data-bg="https://images.unsplash.com/photo-1441974231531-c6227db76b6e?ixlib=rb-4.0.3&auto=format&fit=crop&w=1200&q=80">
                <img src="https://images.unsplash.com/photo-1441974231531-c6227db76b6e?ixlib=rb-4.0.3&auto=format&fit=crop&w=1200&q=80" alt="Dense forest with tall trees" class="slide-image">
                <div class="slide-content">
                    <h2>Forest Wilderness</h2>
                    <p>Dense forest with tall trees and wildlife</p>
                </div>
            </div>
        </div>
        
        <!-- Navigation arrows -->
        <button class="nav-btn prev-btn" onclick="changeSlide(-1)">❮</button>
        <button class="nav-btn next-btn" onclick="changeSlide(1)">❯</button>
        
        <!-- Dots indicator -->
        <div class="dots-container">
            <span class="dot active" onclick="currentSlide(1)"></span>
            <span class="dot" onclick="currentSlide(2)"></span>
            <span class="dot" onclick="currentSlide(3)"></span>
            <span class="dot" onclick="currentSlide(4)"></span>
        </div>
    </div>
    
    <script src="script.js"></script>
</body>
</html>
